# === DATABASE (H2 for development) ===
spring.datasource.url=jdbc:h2:mem:smartllm;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# === JWT ===
jwt.secret=SmartLLMAdvisorSuperSecretKeyForJWT2024XYZ123456789
jwt.expiration=86400000

# === Ollama (local LLM, free) ===
# Start Ollama first, then pull a model: ollama pull llama3.1:8b
# Use 127.0.0.1 (not localhost) — Java on Windows may resolve localhost to IPv6, but Ollama binds to 127.0.0.1 only
ollama.api.url=http://127.0.0.1:11434/v1/chat/completions
ollama.model=llama3.1:8b

# === Server ===
# Port 8080 is often used by Oracle TNS Listener on Windows; use 8081 instead.
server.port=8081