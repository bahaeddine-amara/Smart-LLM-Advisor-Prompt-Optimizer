# === DATABASE (H2 for development) ===
spring.datasource.url=jdbc:h2:mem:smartllm;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# === JWT ===
jwt.secret=SmartLLMAdvisorSuperSecretKeyForJWT2024XYZ123456789
jwt.expiration=86400000

# === DeepSeek API ===
deepseek.api.key=YOUR_DEEPSEEK_API_KEY_HERE
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

# === Server ===
# Port 8080 is often used by Oracle TNS Listener on Windows; use 8081 instead.
server.port=8081